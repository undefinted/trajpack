name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'ubuntu-latest'
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pyarrow==25.0.1 datasets==5.0.1
      - if: matrix.os == 'ubuntu-latest'
        run: python -m unittest discover experiments/trajectory-utility/tests -v
      - run: pnpm build
      - if: matrix.os == 'ubuntu-latest'
        run: |
          python experiments/trajectory-utility/generate_data.py --out work/ci-trajectory-utility --train 16 --eval 8 --seed 20260817
          node experiments/trajectory-utility/validate_with_trajpack.mjs work/ci-trajectory-utility/answer-only.train.jsonl work/ci-trajectory-utility/complete-trajectory.train.jsonl work/ci-trajectory-utility/held-out.eval.jsonl
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - if: matrix.os == 'ubuntu-latest'
        run: pnpm bench:collector:smoke
      - run: node --test examples/deepseek-research-demo/demo.test.mjs
      - run: pnpm audit:static
      - run: pnpm audit --prod
      - run: pnpm test:pack

  browser-build:
    name: Chrome/Edge extension artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trajpack/schema build
      - run: pnpm --filter @trajpack/chromium-extension build
      - run: pnpm --filter @trajpack/chromium-extension test
      - run: pnpm --filter @trajpack/chromium-extension test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trajpack-chromium-mv3
          path: extensions/chromium/build
          if-no-files-found: error
