name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'ubuntu-latest'
        run: python -m pip install --disable-pip-version-check numpy==1.26.4 pyarrow==25.0.1 datasets==5.0.1
      - if: matrix.os == 'ubuntu-latest'
        run: python -m unittest discover experiments/trajectory-utility/tests -v
      - run: pnpm build
      - if: matrix.os == 'ubuntu-latest'
        run: |
          python experiments/trajectory-utility/generate_data.py --out work/ci-trajectory-utility --train 16 --eval 8 --seed 20260817
          node experiments/trajectory-utility/validate_with_trajpack.mjs work/ci-trajectory-utility/answer-only.train.jsonl work/ci-trajectory-utility/complete-trajectory.train.jsonl work/ci-trajectory-utility/held-out.eval.jsonl
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: node --test examples/deepseek-research-demo/demo.test.mjs
      - run: pnpm audit:static
      - run: pnpm audit --prod
      - run: pnpm test:pack

  browser-build:
    name: Chrome/Edge extension artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trajpack/schema build
      - run: pnpm --filter @trajpack/chromium-extension build
      - run: pnpm --filter @trajpack/chromium-extension test
      - run: pnpm --filter @trajpack/chromium-extension test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trajpack-chromium-mv3
          path: extensions/chromium/build
          if-no-files-found: error
