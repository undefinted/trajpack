name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm audit:static
      - run: pnpm audit --prod
      - run: pnpm test:pack

  browser-build:
    name: Chrome/Edge extension artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trajpack/schema build
      - run: pnpm --filter @trajpack/chromium-extension build
      - run: pnpm --filter @trajpack/chromium-extension test
      - run: pnpm --filter @trajpack/chromium-extension test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: trajpack-chromium-mv3
          path: extensions/chromium/build
          if-no-files-found: error
